const D=[
['au',`What are auxiliary verbs?`,`<b>Helping verbs</b> that come before a main verb to build questions, negatives and tenses. They add grammar, not the main meaning.<br>He <ax>does</ax> not <v>understand</v> it.<br>Four groups: <b>do, be, have, modals</b>.`],

['mv',`Main verb or auxiliary?`,`<b>Rule:</b> if the verb is the <b>only</b> verb in the clause, it is a <v>main verb</v>. If another verb follows and carries the meaning, it is an <ax>auxiliary</ax>.<br>The same words (<i>do, be, have</i>) can be either.`],

['mv',`Do you often have headaches?`,`<ax>Do</ax> = auxiliary, <v>have</v> = main verb. <i>Often</i> sits between them but doesn’t change that.`],
['pr',`What is a pronoun?`,`A word that <b>replaces</b> a noun or a noun phrase.<br>The fresh graduate is checking the new outfits.<br><pn>She</pn> is checking <pn>them</pn>.`],
['pr',`What is a noun phrase?`,`A <b>head noun</b> and everything that modifies it: <i>the fresh graduate</i> (head: <n>graduate</n>). A pronoun replaces the <b>whole phrase</b>, not just the noun.`],
['pr',`Pronoun or not? The replacement test`,`<i>The fresh graduate is checking <b>that</b> bag.</i><br><b>That</b> is <b>not</b> a pronoun here, because the noun <i>bag</i> is not replaced.<br>Compare <i>I like <pn>these</pn>.</i> Nothing follows, so these stands in for a noun.`],
['pr',`Same word, pronoun or not?`,`<i>All is lost.</i> → <pn>All</pn> is a pronoun.<br><i>She spent all the money.</i> → <b>all</b> is not a pronoun (it modifies <i>money</i>).<br><i>She found her book.</i> → <b>her</b> is not a pronoun (<i>book</i> stays).`],
['pt',`Subject pronouns`,`<pn>I, you, we, they, he, she, it</pn><br>They do the action or are the topic: <i>She is checking them.</i>`],

['pt',`Possessive pronouns`,`<pn>mine, yours, ours, theirs, his, hers, its</pn><br><i>He is a friend of <b>mine</b>.</i> They stand alone. Before a noun (<i>my brother</i>) the word is not a pronoun.`],
['pt',`Reflexive pronouns`,`<pn>myself, yourself, ourselves, themselves, himself, herself, itself</pn><br>They point back to the subject: <i>Richard, you ought to be ashamed of <b>yourself</b>.</i>`],
['pt',`Relative pronouns`,`<pn>who, which, where, that, whom, when, why</pn><br>They link a clause to a noun: <i>The man <b>who</b> spoke was my brother.</i>`],
['pt',`Interrogative pronouns`,`<pn>who, which, where, what, whose, when, why</pn><br>They ask questions: <i><b>What</b> is the matter?</i>`],
['pt',`Relative vs interrogative`,`They share many forms (<i>who, which, where, when, why</i>). <b>The job decides:</b> asking a question = interrogative (<i>Who is it?</i>). Joining a clause to a noun = relative (<i>the man who spoke</i>).`],
['pt',`Indefinite pronouns`,`Not a specific person or thing.<br><b>-one / -body / -thing:</b> everyone, anyone, someone, everything, anything, something<br><b>Others:</b> any, some, each, all, one, none, many, much, less, few, enough, several, both, either, neither`],
['pt',`Demonstrative and reciprocal`,`<b>Demonstrative:</b> <pn>this, that</pn> point to something: <i>I like these.</i> (Extra: these, those)<br><b>Reciprocal:</b> <pn>other, another</pn> (Extra: <i>each other, one another</i>)`],
['pp',`What is a preposition?`,`A word used with a noun, noun phrase, pronoun or gerund to show a <b>relationship</b> between one person, thing or event and another.`],
['pp',`Four patterns`,`<pp>to</pp> + noun: gave the book to <n>Charlie</n><br>+ noun phrase: to the librarian<br>+ pronoun: to <pn>him</pn> (object form)<br>+ gerund: devotes his time to <v>reading</v>`],
['pp',`List of prepositions (1)`,`in, at, on, upon, by, beside, before, in front of, behind, beyond, over, under, beneath, below, amidst, among, between, within`],
['pp',`List of prepositions (2)`,`without, out, outside, around, round, to, from, onto, into, of, during, for, until, after, like<br>Extra: the list is not complete. <i>through, with, near</i> are prepositions too.`],
['pp',`Prepositions of more than one word`,`<i>in front of</i> is on the list as one preposition. Extra: <i>out of the building</i> works the same way.`],
['ap',`Adverb or preposition? The rule`,`<b>Preposition:</b> relates a noun, noun phrase, pronoun or gerund (it has an object).<br><b>Adverb</b> of place or time: modifies a verb or clause (nothing follows to complete it).`],
['ap',`before: adverb or preposition?`,`<i>I have never been here <b>before</b>.</i> → <d>adverb</d> (time, no object)<br><i>I found it <b>before</b> coming here.</i> → <pp>preposition</pp> (+ gerund)`],
['ap',`outside: adverb or preposition?`,`<i>He was standing <b>outside</b> the building.</i> → <pp>preposition</pp> (+ noun phrase)<br><i>It was raining <b>outside</b>.</i> → <d>adverb</d> (place)`],
['ap',`The quick test`,`Ask “<b>___ what?</b>” If a noun, pronoun or -ing word answers it, it’s a preposition. If nothing follows, it’s an adverb (<i>coming in, called out</i>).`],
['tg',`The big picture`,`<b>Content words:</b> <n>N</n> <v>V</v> <j>Adj</j> <d>Adv</d><br><b>This unit:</b> <ax>auxiliaries</ax>, <pn>pronouns</pn>, <pp>prepositions</pp> (Extra: these are function words).`],
['tg',`What is POS tagging?`,`Labeling every word in a sentence with its part of speech (N, V, adj, adv, prep, pro…). Use the job of the word in <i>this</i> sentence.`],
['tg',`Tag the Mandela quote`,`The <j>greatest</j> <n>glory</n> <pp>in</pp> <v>living</v> <v>lies</v> <d>not</d> <pp>in</pp> <d>never</d> <v>falling</v>, but <pp>in</pp> <v>rising</v> every <n>time</n> <pn>we</pn> <v>fall</v>.<br>Note the dominant use of verbs.`],
['tg',`A tagging routine`,`1. Find the verbs.<br>2. Find who or what does them (nouns, pronouns).<br>3. Find describing words (adjectives, adverbs).<br>4. Find prepositions (a word + its noun).<br>Extra: this order is my suggestion, not from the slides.`]
];

const STUCK=[['Is it a main verb or an auxiliary?','study','mv'],['Which type of pronoun is it?','study','pt'],['Pronoun, or just a word before a noun?','study','pr'],['Adverb or preposition?','study','ap'],['The list of modal verbs','cards','au'],['A quick refresher before a test','cards','all'],['Testing myself','prac','quiz'],['Class exercises with answers','prac','ex']];
const $=id=>document.getElementById(id);
const cards=D.map((c,id)=>({id,s:c[0],q:c[1],a:c[2]}));
const topics=Object.entries(S).map(([k,[n,c]])=>[k,n,c]);
let stT='au',cdT='all',pr='quiz';
function tabs(el,items,cur,pick){el.innerHTML='';items.forEach(([k,n,col])=>{const b=document.createElement('button');b.className='chip'+(k==cur?' on':'');b.style.setProperty('--c',col);b.textContent=n;b.onclick=()=>pick(k);el.appendChild(b)})}
let view='home';
function go(v,t){view=v;if(t){if(v=='study')stT=t;if(v=='cards'){cdT=t;i=0}if(v=='prac')pr=t}
document.querySelectorAll('.view').forEach(x=>x.classList.toggle('on',x.id=='v-'+v));
document.querySelectorAll('nav.bot button').forEach(x=>x.classList.toggle('on',x.dataset.v==v));
({home(){},study,cards:cardsInit,prac})[v]();scrollTo(0,0)}
STUCK.forEach(([t,v,k])=>{const b=document.createElement('button');b.className='go';b.style.setProperty('--c','#fbbf24');b.textContent=t;b.onclick=()=>go(v,k);$('stuck').appendChild(b)});
function study(){tabs($('st-tabs'),topics,stT,k=>{stT=k;study();scrollTo(0,0)});
const col=S[stT][1];let h='<h2 style="color:'+col+'">'+S[stT][0]+'</h2>';
cards.filter(c=>c.s==stT).forEach(c=>h+='<div class="note" style="--c:'+col+'"><h3>'+c.q+'</h3>'+c.a+'</div>');
h+='<div class="rules" style="--c:'+col+'"><h3>Rules to remember</h3><ul>'+R[stT].map(x=>'<li>'+x+'</li>').join('')+'</ul></div>';
h+='<div class="row"><button class="b" onclick="go(\'cards\',stT)">Flashcards</button><button class="b" onclick="go(\'prac\',\'quiz\')">Quiz me</button></div>';
$('st-body').innerHTML=h}
let deck=[],i=0,back=false,busy=false;const known=new Set();
function cardsInit(){tabs($('cd-tabs'),[['all','All','#e9e4ff'],...topics],cdT,k=>{cdT=k;i=0;cardsInit()});build()}
function build(){deck=cards.filter(c=>cdT=='all'||c.s==cdT);if(i>=deck.length)i=0;show()}
function show(){const c=deck[i],col=S[c.s][1];back=false;
$('card').style.setProperty('--c',col);
$('lab').textContent='['+S[c.s][0];$('txt').className='txt q';$('txt').innerHTML=c.q;$('hint').textContent='tap to flip';
$('cnt').textContent='Card '+(i+1)+' of '+deck.length;
const k=deck.filter(x=>known.has(x.id)).length;$('kn').textContent=k+' known';$('pb').style.width=(k/deck.length*100)+'%'}
function flip(){if(busy)return;busy=true;const el=$('card');el.classList.add('fl');
setTimeout(()=>{const c=deck[i];back=!back;$('txt').className='txt'+(back?'':' q');$('txt').innerHTML=back?c.a:c.q;$('hint').textContent=back?'tap to flip back':'tap to flip';el.classList.remove('fl');busy=false},160)}
function step(n){i=(i+n+deck.length)%deck.length;show()}
function mark(v){const c=deck[i];v?known.add(c.id):known.delete(c.id);if(v&&deck.length>1)step(1);else show()}
$('card').onclick=flip;
$('card').onkeydown=e=>{if(e.key==' '||e.key=='Enter'){e.preventDefault();flip()}};
document.onkeydown=e=>{if(view!='cards')return;if(e.key=='ArrowRight')step(1);if(e.key=='ArrowLeft')step(-1)};
$('next').onclick=()=>step(1);$('prev').onclick=()=>step(-1);
$('got').onclick=()=>mark(true);$('again').onclick=()=>mark(false);
$('shuf').onclick=()=>{for(let a=deck.length-1;a>0;a--){const b=Math.floor(Math.random()*(a+1));[deck[a],deck[b]]=[deck[b],deck[a]]}i=0;show()};
$('reset').onclick=()=>{known.clear();show()};
let qs=[],qi=0,sc=0,miss=new Set();
function prac(){tabs($('pr-tabs'),[['quiz','Quiz me','#fb923c'],['ex','Class exercises','#2dd4bf']],pr,k=>{pr=k;prac()});
$('pr-quiz').style.display=pr=='quiz'?'block':'none';$('pr-ex').style.display=pr=='ex'?'block':'none';
if(pr=='quiz'&&!qs.length)startQ();if(pr=='ex'&&!$('pr-ex').innerHTML)ex()}
function startQ(){qs=QZ.slice().sort(()=>Math.random()-.5);qi=0;sc=0;miss=new Set();drawQ()}
function drawQ(){const el=$('pr-quiz');
if(qi>=qs.length){let h='<h2>Score: '+sc+' / '+qs.length+'</h2>';
if(miss.size){h+='<p>Review these topics:</p>';miss.forEach(k=>h+='<button class="go" style="--c:'+S[k][1]+'" onclick="go(\'study\',\''+k+'\')"><b>'+S[k][0]+'</b>Open the notes</button>')}else h+='<p>No mistakes. Try the class exercises next.</p>';
el.innerHTML=h+'<div class="row"><button class="b" onclick="startQ()">Try again</button><button class="b" onclick="go(\'prac\',\'ex\')">Class exercises</button></div>';return}
const [t,q,o,a,w]=qs[qi];
el.innerHTML='<div class="meta"><span>Question '+(qi+1)+' of '+qs.length+'</span><span>Correct: '+sc+'</span></div><div class="note" style="--c:'+S[t][1]+'"><h3>'+q+'</h3></div>'+o.map((x,n)=>'<button class="opt" data-n="'+n+'">'+x+'</button>').join('')+'<div id="fb"></div>';
el.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const n=+b.dataset.n;
el.querySelectorAll('.opt').forEach((x,m)=>{x.disabled=true;if(m==a)x.classList.add('ok')});
if(n==a)sc++;else{b.classList.add('no');miss.add(t)}
$('fb').innerHTML='<div class="note" style="--c:'+(n==a?'#34d399':'#fb7185')+'"><h3>'+(n==a?'Correct':'Not quite')+'</h3>'+w+'</div><button class="b" style="width:100%" onclick="qi++;drawQ()">Next question</button>'})}
function ex(){let h='';EX.forEach(([t,intro,items])=>{h+='<h2>'+t+'</h2><div class="note" style="--c:#2dd4bf">'+intro+'</div>';items.forEach(([p,a])=>h+='<details class="ex"><summary>'+p+'</summary><p>'+a+'</p></details>')});$('pr-ex').innerHTML=h}
</script>
</body>
</html>
